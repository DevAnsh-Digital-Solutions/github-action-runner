# .github/actions/dependency-scan/action.yml
#
# What: Runs osv-scanner (Google's OSV database CLI, installed here as a
#       checksum-verified pinned binary — not a third-party GitHub Action)
#       against the project's dependency file(s), uploads SARIF, and gates on
#       the count of vulnerabilities at/above `severity_threshold`. Findings
#       are shown as a table — Severity | Package | Installed | Vulnerability
#       | Fixed in, highest severity first — in the job summary and again in
#       the log of the final "Enforce" step, right under the failure message
#       that says what to run to fix them. The raw osv-scanner JSON is also
#       uploaded as the "dependency-scan-results" artifact for the LLM review.
# Languages: js, ts, python. flutter/unity hard-fail as not yet implemented;
#        any other `language` value hard-fails with the supported list.
# Needs: js/ts: one of package-lock.json / pnpm-lock.yaml / yarn.lock in
#        `working_dir`.
#        python: at least one of requirements.txt / poetry.lock / Pipfile.lock
#        in `working_dir` (every one present is scanned). osv-scanner reads a
#        requirements.txt literally and does not resolve version ranges, so
#        pin exact versions (==), transitive dependencies included (e.g. from
#        `pip freeze`), or prefer a lockfile.
#        Both: network access to github.com (binary download) and api.osv.dev
#        (the scan itself), and `node` (to render the findings; preinstalled
#        on GitHub-hosted runners). No secrets required beyond the default
#        GITHUB_TOKEN (used only for the SARIF upload).
# Exits non-zero on: an unsupported/not-yet-implemented `language`, an
#        invalid `severity_threshold`, no dependency file, osv-scanner
#        producing unparseable output (binary download/checksum failure,
#        network failure reaching the OSV API, corrupt lockfile — a crash,
#        distinct from real findings), or vulnerabilities at/above the
#        threshold.
#
# One finding = one real vulnerability, not one OSV record: the same flaw is
# often published as a GHSA-, PYSEC- and CVE- record, and scripts/
# parse-osv-results.mjs merges records that alias each other.
#
# Severity classification limitation: some OSV records only carry a full
# CVSS vector string (e.g. "CVSS:3.1/AV:N/..."), not a plain severity label
# or bare score. Computing a CVSS base score from a vector is non-trivial
# and getting it wrong would silently mis-gate a security check, so
# scripts/parse-osv-results.mjs deliberately does not attempt it — it uses
# the label/score the advisory (or osv-scanner itself) provides, and
# findings with none are reported as UNKNOWN severity and never counted
# toward the threshold. See that script's header comment for the full rule.
name: Dependency Scan (JS/TS/Python)
description: Runs osv-scanner against the dependency file(s) and gates on severity threshold.

inputs:
  language:
    description: "Language to scan. js, ts and python are implemented in this version."
    required: true
  working_dir:
    description: "Directory containing the lockfile / requirements.txt, relative to repo root."
    required: false
    default: '.'
  severity_threshold:
    description: "Minimum severity that fails the check: LOW, MEDIUM, HIGH, or CRITICAL."
    required: false
    default: 'HIGH'

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        case "${LANGUAGE}" in
          js|ts|python)
            ;; # implemented by this action
          flutter|unity)
            die "language '${LANGUAGE}' is not yet implemented in this version"
            ;;
          *)
            die "unsupported language '${LANGUAGE}'. Supported values: js ts python flutter unity"
            ;;
        esac
        case "$(printf '%s' "${SEVERITY_THRESHOLD}" | tr '[:lower:]' '[:upper:]')" in
          LOW|MEDIUM|MODERATE|HIGH|CRITICAL) ;;
          *) die "invalid severity_threshold '${SEVERITY_THRESHOLD}'. Expected one of: LOW, MEDIUM, HIGH, CRITICAL." ;;
        esac

    - name: Detect dependency files
      id: detect
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        case "${LANGUAGE}" in
          js|ts)
            # the lockfile of whichever package manager the project uses
            manager="$(detect_package_manager .)"
            case "${manager}" in
              npm) echo "lockfiles=package-lock.json" >> "$GITHUB_OUTPUT" ;;
              pnpm) echo "lockfiles=pnpm-lock.yaml" >> "$GITHUB_OUTPUT" ;;
              yarn) echo "lockfiles=yarn.lock" >> "$GITHUB_OUTPUT" ;;
            esac
            ;;
          python)
            # every one of requirements.txt / poetry.lock / Pipfile.lock present
            echo "lockfiles=$(detect_python_scan_files .)" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Install osv-scanner
      id: install
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        require_cmd curl
        require_cmd sha256sum
        version="2.5.1"
        checksum="f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"
        bin_path="${RUNNER_TEMP}/osv-scanner"
        curl -sSL --fail -o "${bin_path}" "https://github.com/google/osv-scanner/releases/download/v${version}/osv-scanner_linux_amd64" \
          || die "failed to download osv-scanner v${version} from github.com — check network access / GitHub status."
        if ! echo "${checksum}  ${bin_path}" | sha256sum -c - >/dev/null 2>&1; then
          die "osv-scanner v${version} download failed checksum verification. Refusing to execute a binary that doesn't match the known-good SHA256."
        fi
        chmod 0755 "${bin_path}"
        echo "bin_path=${bin_path}" >> "$GITHUB_OUTPUT"

    - name: Run osv-scanner
      id: run
      # GitHub's default `shell: bash` invokes `bash -eo pipefail {0}` — -e
      # is already active before our own `set` line runs and would abort
      # this step (before the sarif-format scan even runs) the instant the
      # json-format scan exits non-zero. Override the invocation to drop -e.
      shell: bash --noprofile --norc -o pipefail {0}
      continue-on-error: true
      working-directory: ${{ inputs.working_dir }}
      env:
        BIN_PATH: ${{ steps.install.outputs.bin_path }}
        LOCKFILES: ${{ steps.detect.outputs.lockfiles }}
      run: |
        set -uo pipefail # no -e: classification is based on whether valid output was produced, not the raw exit code
        # One -L per detected file. The names come from a fixed allow-list in
        # scripts/lib.sh / the detect step (no spaces), so splitting on
        # whitespace here is safe.
        read -r -a lockfile_list <<< "${LOCKFILES}"
        lockfile_args=()
        for lockfile in "${lockfile_list[@]}"; do
          lockfile_args+=(-L "${lockfile}")
        done
        "${BIN_PATH}" scan --format json "${lockfile_args[@]}" > osv-results.json
        echo "json_exit_code=$?" >> "$GITHUB_OUTPUT"
        "${BIN_PATH}" scan --format sarif "${lockfile_args[@]}" > dependency-scan.sarif
        echo "sarif_exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Parse results
      id: parse
      # GitHub's default `shell: bash` invokes `bash -eo pipefail {0}` — -e
      # is already active before our own `set` line runs and would abort
      # this step the instant the parser exits non-zero, before we can
      # capture its exit code below. Override the invocation to drop -e.
      shell: bash --noprofile --norc -o pipefail {0}
      continue-on-error: true
      working-directory: ${{ inputs.working_dir }}
      env:
        SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
      run: |
        set -uo pipefail # no -e: we capture the parser's exit code ourselves below
        node "${GITHUB_ACTION_PATH}/../../../scripts/parse-osv-results.mjs" osv-results.json "${SEVERITY_THRESHOLD}" > parse-result.json
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Classify and summarize result
      id: classify
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working_dir }}
      env:
        EXIT_CODE: ${{ steps.parse.outputs.exit_code }}
        SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"

        if [ -z "${EXIT_CODE}" ] || [ "${EXIT_CODE}" -ne 0 ]; then
          echo "outcome=crash" >> "$GITHUB_OUTPUT"
          die "could not read osv-scanner's results as valid JSON — treating this as a scanner crash (binary/network/lockfile problem), not vulnerability findings. Check the 'Run osv-scanner' step's log above."
        fi

        # shellcheck disable=SC2016 # single-quoted on purpose: this is JS for `node -e`, not a bash expansion
        table="$(node -e '
          const r = JSON.parse(require("fs").readFileSync("parse-result.json", "utf8"));
          console.log(`| Severity | Count |\n|---|---|\n| Critical | ${r.counts.CRITICAL} |\n| High | ${r.counts.HIGH} |\n| Medium | ${r.counts.MEDIUM} |\n| Low | ${r.counts.LOW} |\n| Unknown (not gated) | ${r.counts.UNKNOWN} |\n\nThreshold: ${r.threshold} — ${r.atOrAboveThreshold} finding(s) at/above threshold.`);
        ')"
        summary "### Dependency scan"
        summary "${table}"

        total="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("parse-result.json","utf8")).total)')"
        if [ "${total}" -gt 0 ]; then
          # Per-vulnerability detail, highest severity first: which package,
          # which version is installed, which advisory, and what fixes it —
          # the counts table above only says how many. Shown even on a pass,
          # since below-threshold findings are still worth seeing.
          summary "#### Vulnerable dependencies"
          detail_table="$(node "${GITHUB_ACTION_PATH}/../../../scripts/parse-osv-results.mjs" osv-results.json "${SEVERITY_THRESHOLD}" markdown)"
          summary "${detail_table}"
        fi

        at_or_above="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("parse-result.json","utf8")).atOrAboveThreshold)')"
        if [ "${at_or_above}" -eq 0 ]; then
          echo "outcome=pass" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=findings" >> "$GITHUB_OUTPUT"
          # Inline annotations on the PR diff — works with no Code Security
          # license. Capped: a run with dozens of findings relies on the
          # table above for the rest, not an unbounded wall of them.
          node "${GITHUB_ACTION_PATH}/../../../scripts/summarize-sarif.mjs" dependency-scan.sarif annotations 15
        fi

    - name: Upload SARIF
      if: steps.classify.outputs.outcome != 'crash'
      # continue-on-error: this requires a GitHub Code Security license on a
      # private repo ("Advanced Security must be enabled..."); we don't want
      # a licensing gap to fail an otherwise-passing check. The counts table
      # above and the artifact below are what's *not* license-gated.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        sarif_file: ${{ inputs.working_dir }}/dependency-scan.sarif

    - name: Upload SARIF artifact
      # Plain Actions build-artifact storage — a different feature from
      # code-scanning ingestion above, free on every repo tier. Keeps the
      # full-fidelity SARIF downloadable even when the upload step no-ops.
      if: steps.classify.outputs.outcome != 'crash'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dependency-scan-sarif
        path: ${{ inputs.working_dir }}/dependency-scan.sarif
        if-no-files-found: warn
        retention-days: 30

    - name: Upload scan results artifact
      # osv-scanner's raw JSON — the file this check gates on — so the
      # advisory LLM review (.github/actions/llm-review/) can name each
      # vulnerable package, its advisory and the fixed version.
      if: steps.classify.outputs.outcome != 'crash'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dependency-scan-results
        path: ${{ inputs.working_dir }}/osv-results.json
        if-no-files-found: warn
        retention-days: 7

    - name: Enforce dependency-scan result
      if: steps.classify.outputs.outcome != 'pass'
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        OUTCOME: ${{ steps.classify.outputs.outcome }}
        LANGUAGE: ${{ inputs.language }}
        SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
      run: |
        set -euo pipefail
        if [ "${OUTCOME}" != "findings" ]; then
          # crash (or classify never reported): there is no trustworthy
          # findings table to print, so point at the scanner's own logs.
          echo "::error::dependency-scan did not complete (outcome: '${OUTCOME:-unknown}'). This is a scanner/infrastructure problem, not a vulnerability finding — see the 'Run osv-scanner' and 'Classify and summarize result' steps above."
          exit 1
        fi

        case "${LANGUAGE}" in
          js|ts)
            # npm/pnpm/yarn remediation
            fix="Run 'npm audit fix' (or 'npm install <package>@<Fixed in version>' for each package below; pnpm/yarn: 'pnpm update <package>@<version>' / 'yarn upgrade <package>@<version>'), then commit the updated lockfile."
            ;;
          python)
            # pip/poetry/pipenv remediation
            fix="For each package below run 'pip install --upgrade <package>==<Fixed in version>' and update its pin in requirements.txt (poetry: 'poetry update <package>', pipenv: 'pipenv update <package>'), then commit the updated file."
            ;;
          *)
            fix="Upgrade each package below to its 'Fixed in' version and commit the updated dependency file."
            ;;
        esac
        echo "::error::dependency-scan found vulnerabilities at or above ${SEVERITY_THRESHOLD}. To fix: ${fix}"
        echo
        echo "Vulnerable dependencies (highest severity first):"
        # Same findings as the job summary's table, in plain text, so they
        # sit right under the failure message in this step's log. Never let
        # a rendering problem hide the failure itself.
        node "${GITHUB_ACTION_PATH}/../../../scripts/parse-osv-results.mjs" osv-results.json "${SEVERITY_THRESHOLD}" text \
          || echo "(could not render the findings table — see the uploaded SARIF artifact)"
        exit 1
