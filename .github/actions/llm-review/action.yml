# .github/actions/llm-review/action.yml
#
# What: Advisory AI review of a pull request. Two modes, run as two jobs by
#       central-ci.yml:
#         preflight  runs FIRST, in parallel with lint/unit-test/coverage. It
#                    checks that the AI token secret is present and that the
#                    provider accepts it, so a missing or wrong token is
#                    reported within seconds, before anything is collected or
#                    sent anywhere. Sets the `ready` output.
#         review     runs AFTER the other checks have finished (pass or fail).
#                    It reads their outputs (lint SARIF, test results,
#                    coverage report, osv-scanner JSON, and the secret scan's
#                    rule/file/line only — never a secret's value or message)
#                    plus the PR diff, asks the model for a
#                    structured review, and publishes it as one PR comment
#                    (created once, updated on each push, with a checkbox per
#                    point) and in the job summary.
#       The review is ADVISORY: it never changes any other check's result, and
#       central-ci.yml marks both LLM jobs continue-on-error.
# Providers: openai-compatible (OpenAI, Gemini's OpenAI endpoint, Groq,
#       OpenRouter, Mistral, DeepSeek, Ollama, vLLM, LiteLLM, ...), anthropic,
#       gemini (native). Any model those APIs serve; the model name is an input.
# Languages: the review itself is language-agnostic, so all of js, ts, python,
#       flutter and unity are accepted; the language is only given to the model
#       as context. Any other value hard-fails with the supported list.
# Needs: node (preinstalled on GitHub-hosted runners); the AI token as the
#       `ai_token` input (pass the AI_TOKEN secret); in review mode a checkout
#       with full history (fetch-depth: 0) so the PR diff can be computed, and
#       a job token with `pull-requests: write` to post the comment.
# Exits non-zero (preflight mode) on: an unsupported language/mode, an empty
#       AI token, a rejected AI token, an invalid provider/model/base URL.
# Exits non-zero (review mode) on: the diff not being computable, the provider
#       failing after retries, or the model returning no valid review.
#       Findings in the review NEVER fail this action. A comment that cannot be
#       posted (fork PR, read-only token) is a warning; the review is still in
#       the job summary.
name: LLM Review (advisory)
description: Verifies the AI token, then reviews a PR's diff and its lint, test and coverage results with an LLM.

inputs:
  mode:
    description: "'preflight' (verify the token, set the ready output) or 'review' (produce and post the review)."
    required: true
  language:
    description: "Project language, given to the model as context. One of: js, ts, python, flutter, unity."
    required: true
  working_dir:
    description: "Directory containing the project, relative to repo root. In review mode only changes under it are reviewed."
    required: false
    default: '.'
  ai_token:
    description: "API key for the LLM provider (pass the AI_TOKEN secret)."
    required: false
    default: ''
  llm_provider:
    description: "Wire format: openai-compatible, anthropic or gemini."
    required: false
    default: 'openai-compatible'
  llm_base_url:
    description: "API base URL. Empty uses the provider's standard URL."
    required: false
    default: ''
  llm_model:
    description: "Model name exactly as the provider expects it."
    required: true
  llm_max_output_tokens:
    description: "Output token limit. Sent only to Anthropic, which requires one; other providers use their own default."
    required: false
    default: '4096'
  llm_timeout_seconds:
    description: "Per-request timeout in seconds."
    required: false
    default: '120'
  llm_max_diff_kb:
    description: "Maximum size of the PR diff sent to the model, in KB. Larger diffs are cut and the comment says so."
    required: false
    default: '200'
  llm_max_findings:
    description: "Maximum number of review points in the comment, across all sections."
    required: false
    default: '20'
  llm_exclude_paths:
    description: "Comma or newline separated globs of files kept out of the diff sent to the model (lockfiles, build output)."
    required: false
    default: 'package-lock.json,pnpm-lock.yaml,yarn.lock,poetry.lock,Pipfile.lock,*.min.js,*.map,dist/**,build/**,coverage/**'
  lint_result:
    description: "Result of the lint job: success, failure, cancelled or skipped (review mode)."
    required: false
    default: 'skipped'
  unit_test_result:
    description: "Result of the unit-test job (review mode)."
    required: false
    default: 'skipped'
  coverage_result:
    description: "Result of the coverage job (review mode)."
    required: false
    default: 'skipped'
  dependency_scan_result:
    description: "Result of the dependency-scan job (review mode)."
    required: false
    default: 'skipped'
  secret_scan_result:
    description: "Result of the secret-scan job (review mode)."
    required: false
    default: 'skipped'
  coverage_threshold:
    description: "The coverage threshold the coverage job enforced (review mode)."
    required: false
    default: '80'
  github_token:
    description: "Token used to post the PR comment. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}

outputs:
  ready:
    description: "preflight mode: 'true' only when this is a pull_request run and the AI token is present and accepted."
    value: ${{ steps.ready.outputs.ready }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        case "${MODE}" in
          preflight|review)
            ;; # implemented by this action
          *)
            die "unsupported mode '${MODE}'. Supported values: preflight review"
            ;;
        esac
        case "${LANGUAGE}" in
          js|ts|python|flutter|unity)
            ;; # the review is language-agnostic; the language is only prompt context
          *)
            die "unsupported language '${LANGUAGE}'. Supported values: js ts python flutter unity"
            ;;
        esac
        require_cmd node "it runs the review script; it is preinstalled on GitHub-hosted runners"

    # ------------------------------------------------------------------
    # preflight mode
    # ------------------------------------------------------------------
    - name: Check this is a pull request
      id: event
      if: inputs.mode == 'preflight'
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
          # Not an error: consumers often call the workflow on push too. Say
          # so explicitly rather than passing without a word.
          echo "is_pr=false" >> "$GITHUB_OUTPUT"
          echo "::notice::LLM review skipped: it only runs on pull_request events (this run is '${GITHUB_EVENT_NAME}')."
          summary "### AI review: skipped"
          summary "It only runs on pull requests; this run was triggered by \`${GITHUB_EVENT_NAME}\`."
        else
          echo "is_pr=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Check the AI token
      if: inputs.mode == 'preflight' && steps.event.outputs.is_pr == 'true'
      shell: bash
      env:
        AI_TOKEN: ${{ inputs.ai_token }}
        LLM_PROVIDER: ${{ inputs.llm_provider }}
        LLM_BASE_URL: ${{ inputs.llm_base_url }}
        LLM_MODEL: ${{ inputs.llm_model }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        # The script prints a specific ::error:: for each failure (missing,
        # rejected, bad config); add the summary line so the run page says why
        # the review is absent without opening the log.
        if ! node "${GITHUB_ACTION_PATH}/../../../scripts/llm-review.mjs" preflight; then
          summary "### AI review: cannot run"
          summary "The AI token or LLM settings failed validation — see the error annotation. This check is advisory; lint, tests and the other checks are unaffected."
          exit 1
        fi
        summary "### AI review: ready"
        summary "AI token present; provider \`${LLM_PROVIDER}\`, model \`${LLM_MODEL}\`. The review runs after lint, tests and coverage finish."

    - name: Mark ready
      id: ready
      if: inputs.mode == 'preflight'
      shell: bash
      env:
        IS_PR: ${{ steps.event.outputs.is_pr }}
      run: |
        set -euo pipefail
        # Reached only if the token check above passed (steps stop at the
        # first failure), and only counts for pull requests.
        echo "ready=${IS_PR}" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # review mode
    # ------------------------------------------------------------------
    - name: Compute the PR diff
      if: inputs.mode == 'review'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        WORKING_DIR: ${{ inputs.working_dir }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        require_cmd git

        # Both SHAs come from the event payload, but validate the shape anyway
        # before they reach a git command line.
        case "${BASE_SHA}${HEAD_SHA}" in
          ''|*[!0-9a-f]*) die "this is not a pull_request event with usable base/head commit SHAs (base='${BASE_SHA}', head='${HEAD_SHA}')." ;;
        esac

        out_dir="${RUNNER_TEMP}/llm-review"
        mkdir -p "${out_dir}/out"
        # Three-dot: only what the PR itself changed, not what base gained since.
        # quotepath=off keeps non-ASCII file names readable in the diff headers.
        git -c core.quotepath=off diff --no-color --no-ext-diff -U3 "${BASE_SHA}...${HEAD_SHA}" -- "${WORKING_DIR}" > "${out_dir}/pr.diff" \
          || die "could not compute the PR diff (${BASE_SHA}...${HEAD_SHA}). The checkout needs full history: use actions/checkout with fetch-depth: 0."
        if [ ! -s "${out_dir}/pr.diff" ]; then
          echo "::warning::The PR diff under '${WORKING_DIR}' is empty; the review will cover the check results only."
        fi

    - name: Download lint results
      if: inputs.mode == 'review' && inputs.lint_result != 'skipped'
      # continue-on-error: a crashed lint job uploads nothing. The review then
      # says "no output available" instead of failing.
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: lint-sarif
        path: ${{ runner.temp }}/llm-review/lint

    - name: Download unit-test results
      if: inputs.mode == 'review' && inputs.unit_test_result != 'skipped'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: unit-test-results
        path: ${{ runner.temp }}/llm-review/tests

    - name: Download coverage report
      if: inputs.mode == 'review' && inputs.coverage_result != 'skipped'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-report
        path: ${{ runner.temp }}/llm-review/coverage

    - name: Download dependency-scan results
      if: inputs.mode == 'review' && inputs.dependency_scan_result != 'skipped'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dependency-scan-results
        path: ${{ runner.temp }}/llm-review/deps

    - name: Download secret-scan results
      # The --redact'ed SARIF. The review script keeps only rule, file and
      # line from it; finding messages never reach the model or the comment.
      if: inputs.mode == 'review' && inputs.secret_scan_result != 'skipped'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: secret-scan-sarif
        path: ${{ runner.temp }}/llm-review/secrets

    - name: Review with the LLM
      if: inputs.mode == 'review'
      shell: bash
      env:
        AI_TOKEN: ${{ inputs.ai_token }}
        LANGUAGE: ${{ inputs.language }}
        LLM_PROVIDER: ${{ inputs.llm_provider }}
        LLM_BASE_URL: ${{ inputs.llm_base_url }}
        LLM_MODEL: ${{ inputs.llm_model }}
        LLM_MAX_OUTPUT_TOKENS: ${{ inputs.llm_max_output_tokens }}
        LLM_TIMEOUT_SECONDS: ${{ inputs.llm_timeout_seconds }}
        LLM_MAX_DIFF_KB: ${{ inputs.llm_max_diff_kb }}
        LLM_MAX_FINDINGS: ${{ inputs.llm_max_findings }}
        LLM_EXCLUDE_PATHS: ${{ inputs.llm_exclude_paths }}
        LLM_DIFF_FILE: ${{ runner.temp }}/llm-review/pr.diff
        LLM_OUTPUT_DIR: ${{ runner.temp }}/llm-review/out
        LINT_RESULT: ${{ inputs.lint_result }}
        LINT_DIR: ${{ runner.temp }}/llm-review/lint
        UNIT_TEST_RESULT: ${{ inputs.unit_test_result }}
        TEST_DIR: ${{ runner.temp }}/llm-review/tests
        COVERAGE_RESULT: ${{ inputs.coverage_result }}
        COVERAGE_DIR: ${{ runner.temp }}/llm-review/coverage
        COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        DEPENDENCY_SCAN_RESULT: ${{ inputs.dependency_scan_result }}
        DEPS_DIR: ${{ runner.temp }}/llm-review/deps
        SECRET_SCAN_RESULT: ${{ inputs.secret_scan_result }}
        SECRETS_DIR: ${{ runner.temp }}/llm-review/secrets
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        if ! node "${GITHUB_ACTION_PATH}/../../../scripts/llm-review.mjs" review; then
          summary "### AI review: failed"
          summary "The review could not be produced — see the error annotation. This check is advisory and does not block the PR."
          exit 1
        fi
        # The full review goes into the job summary, so it is readable on the
        # run page even when the PR comment cannot be posted.
        cat "${LLM_OUTPUT_DIR}/llm-review.md" >> "${GITHUB_STEP_SUMMARY}"

    - name: Post the PR comment
      if: inputs.mode == 'review'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEW_FILE: ${{ runner.temp }}/llm-review/out/llm-review.md
      run: |
        set -euo pipefail
        # Creates the comment once and edits it on later pushes. A failure to
        # post (fork PR, read-only token) is a warning, not a failure.
        node "${GITHUB_ACTION_PATH}/../../../scripts/llm-review.mjs" post "${REVIEW_FILE}"

    - name: Upload review artifact
      if: inputs.mode == 'review' && !cancelled()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: llm-review
        path: ${{ runner.temp }}/llm-review/out/
        if-no-files-found: ignore # nothing was written if the review failed
        retention-days: 14
