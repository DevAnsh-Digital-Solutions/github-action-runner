# .github/actions/setup/action.yml
#
# What: Installs the JS/TS toolchain (Node.js) and project dependencies.
#       Not a "check" itself — a prerequisite step other check actions in
#       this job run after. Detects the package manager from whichever
#       lockfile is present and uses its matching install command. If no
#       lockfile is committed, falls back to `npm install` from
#       package.json alone — reproducible installs are preferred, but
#       reusability for repos that don't commit a lockfile matters more
#       here than in dependency-scan (which cannot function meaningfully
#       without one, since it needs exact resolved versions, not semver
#       ranges — see .github/actions/dependency-scan/action.yml).
# Languages: js, ts. Any other `language` value hard-fails — see below.
# Needs: a package.json in `working_dir`. No secrets required.
# Exits non-zero on: an unsupported/not-yet-implemented `language`, or the
#        install command itself failing (bad dependency, registry/network
#        failure, etc).
name: Setup (JS/TS)
description: Installs Node.js and project dependencies for a JS/TS project.

inputs:
  language:
    description: "Language to set up. Only js/ts are implemented in this version."
    required: true
  working_dir:
    description: "Directory containing package.json / the lockfile, relative to repo root."
    required: false
    default: '.'
  node_version:
    description: "Node.js version to install, passed straight to actions/setup-node."
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Validate language is implemented
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        case "${LANGUAGE}" in
          js|ts)
            ;; # implemented by this action
          python|flutter|unity)
            die "language '${LANGUAGE}' is not yet implemented in this version"
            ;;
          *)
            die "unsupported language '${LANGUAGE}'. Supported values: js ts python flutter unity"
            ;;
        esac

    - name: Detect package manager
      id: detect
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working_dir }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        require_file "${WORKING_DIR}/package.json"

        # detect_package_manager dies if no lockfile exists, which is the
        # right behavior for dependency-scan (it can't function without
        # one) but not here — check for a lockfile ourselves first so a
        # missing one falls back to plain `npm install` instead of failing.
        if [ -f "${WORKING_DIR}/package-lock.json" ] || [ -f "${WORKING_DIR}/pnpm-lock.yaml" ] || [ -f "${WORKING_DIR}/yarn.lock" ]; then
          manager="$(detect_package_manager "${WORKING_DIR}")"
        else
          manager="npm-install-fallback"
        fi
        echo "manager=${manager}" >> "$GITHUB_OUTPUT"

        # actions/setup-node's built-in cache only understands 'npm' without
        # extra setup (pnpm/yarn caching needs the tool itself on PATH
        # first, which we don't have yet at this point), and even 'npm'
        # mode needs a package-lock.json to hash for the cache key. Only
        # opt in when we know one exists; every other case (pnpm, yarn, the
        # no-lockfile fallback) still installs below, just uncached.
        if [ "${manager}" = "npm" ]; then
          echo "cache=npm" >> "$GITHUB_OUTPUT"
        else
          echo "cache=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ steps.detect.outputs.cache }}
        cache-dependency-path: ${{ inputs.working_dir }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        MANAGER: ${{ steps.detect.outputs.manager }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091 # only resolvable at runtime, relative to the composite action's own checkout
        source "${GITHUB_ACTION_PATH}/../../../scripts/lib.sh"
        require_cmd node "actions/setup-node above should have installed it"
        case "${MANAGER}" in
          npm)
            # npm: reproducible install straight from package-lock.json
            require_cmd npm
            npm ci
            ;;
          pnpm)
            # pnpm ships via corepack (bundled with Node >=16.9); activate
            # it before installing so `pnpm` is resolvable at all.
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile
            ;;
          yarn)
            # yarn (classic or berry, both handled by corepack) install
            # respecting the committed lockfile.
            corepack enable
            yarn install --frozen-lockfile
            ;;
          npm-install-fallback)
            # No lockfile committed. Re-resolves semver ranges from
            # package.json — not reproducible across runs the way `npm ci`
            # is, but keeps lint/unit-test/coverage usable for repos that
            # don't commit one. dependency-scan still requires a real
            # lockfile regardless; this fallback doesn't extend to it.
            require_cmd npm
            npm install
            ;;
          *)
            die "internal error: unrecognized package manager '${MANAGER}' from the detect step"
            ;;
        esac
