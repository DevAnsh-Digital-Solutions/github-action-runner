# .github/workflows/self-check.yml
#
# CI for this repository itself (not for consumer repos). Lints every
# workflow/action YAML file with actionlint and every shell script with
# shellcheck, so the reusable workflow and composite actions stay valid
# before consumers ever pick up a change.
name: Self Check

on:
  pull_request:
  push:
    branches: [main]

# Default to least privilege; both jobs only need to read the repo.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # Reusable workflow plus every composite action.yml under .github/actions/.
          files: ".github/workflows/*.yml,.github/actions/**/action.yml"
          fail-on-error: true

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # Scans the whole repo tree (scripts/ and tests/), skipping only
          # docs/vendor dirs shellcheck has no business looking at.
          ignore_paths: docs
          # Check all shell files together so tests/ scripts that `source`
          # scripts/lib.sh via a relative path don't trip SC1090/SC1091.
          check_together: 'yes'
