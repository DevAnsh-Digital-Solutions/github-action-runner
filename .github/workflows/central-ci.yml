# .github/workflows/central-ci.yml
#
# Reusable workflow: the single entry point consumer repos call into.
# Wires the composite actions under .github/actions/ into jobs, each gated
# behind its own boolean flag per CLAUDE.md's architecture rules. Trigger
# and branch policy stay entirely in the consumer's own ci.yml — this
# workflow only knows about `language` and the enable_* flags.
#
# Phases 1-2 implement checks for js/ts and python (lint, unit-test,
# coverage, dependency-scan, secret-scan). flutter/unity are accepted by
# validate-inputs (they're on the project's eventual roadmap) but every
# check's own composite action hard-fails them with "not yet implemented
# in this version" rather than silently skipping or passing.
#
# Optional advisory AI review (enable_llm_review, default off): two extra jobs,
# llm-preflight (verifies the ai_token secret early) and llm-review (reviews
# the PR diff plus every other check's output and comments on the
# PR). Both are continue-on-error, so they can never block a run.
#
# Composite action references below use the full
# DevAnsh-Digital-Solutions/github-action-runner/... form pinned to a ref,
# NOT a local `./` path. `uses: ./path` always resolves against whatever is
# currently checked out in the job's GITHUB_WORKSPACE — since every job
# here checks out the CALLING (consumer) repo first, a local path would
# resolve inside the consumer's tree instead of this repo's, and fail to
# find the action at all. This also means these internal references are
# pinned to one fixed ref regardless of what ref a consumer calls this
# workflow at, which deviates from README.md's stated versioning policy
# ("internal uses: references use the same ref the consumer called") —
# threading the actual caller-supplied ref through to these lines needs
# follow-up work.
#
# RELEASE REF: the references below point at this commit's own tag
# (currently `@v1.1.0-rc.4`), so a consumer calling that tag runs exactly the
# actions released with this workflow. Every release or pre-release must bump
# them to its own tag in the commit that gets tagged (see README →
# Under the hood → Versions).
name: Central CI

on:
  workflow_call:
    inputs:
      language:
        description: "Language to run checks for. One of: js, ts, python, flutter, unity."
        type: string
        required: true
      working_dir:
        description: "Directory containing the project to check, relative to the consumer repo root."
        type: string
        required: false
        default: '.'
      runner_label:
        description: "Runner label the jobs execute on."
        type: string
        required: false
        default: 'ubuntu-latest'
      enable_lint:
        description: "Run the lint check."
        type: boolean
        required: false
        default: true
      enable_unit_test:
        description: "Run the unit-test check. Must be true if enable_coverage is true."
        type: boolean
        required: false
        default: true
      enable_coverage:
        description: "Run the coverage check. Requires enable_unit_test: true, since coverage is parsed from the unit-test run's output."
        type: boolean
        required: false
        default: true
      enable_dependency_scan:
        description: "Run the dependency-scan (SCA) check."
        type: boolean
        required: false
        default: true
      enable_secret_scan:
        description: "Run the secret-scan check."
        type: boolean
        required: false
        default: true
      coverage_threshold:
        description: "Minimum required 'lines' coverage percentage, when enable_coverage is true."
        type: number
        required: false
        default: 80
      python_version:
        description: "Python version to install when language is python, passed to actions/setup-python."
        type: string
        required: false
        default: '3.12'
      enable_llm_review:
        description: "Run the advisory AI review of the PR (needs the ai_token secret and llm_model). Never blocks. Pull requests only. Default false: it costs money and sends the diff to an LLM provider."
        type: boolean
        required: false
        default: false
      llm_provider:
        description: "LLM API wire format: openai-compatible (OpenAI, Gemini's OpenAI endpoint, Groq, OpenRouter, Mistral, Ollama, ...), anthropic, or gemini (native)."
        type: string
        required: false
        default: 'openai-compatible'
      llm_base_url:
        description: "LLM API base URL. Empty uses the provider's standard URL. Set it for OpenAI-compatible providers other than OpenAI, e.g. https://generativelanguage.googleapis.com/v1beta/openai for Gemini."
        type: string
        required: false
        default: ''
      llm_model:
        description: "Model name exactly as the provider expects it (e.g. gpt-4o, gemini-2.5-flash, claude-sonnet-5-5). Required when enable_llm_review is true."
        type: string
        required: false
        default: ''
      llm_max_output_tokens:
        description: "Output token limit. Sent only to Anthropic, which requires one."
        type: number
        required: false
        default: 4096
      llm_timeout_seconds:
        description: "Per-request timeout for the LLM call, in seconds."
        type: number
        required: false
        default: 120
      llm_max_diff_kb:
        description: "Maximum PR diff size sent to the model, in KB. Larger diffs are cut and the comment says so."
        type: number
        required: false
        default: 200
      llm_max_findings:
        description: "Maximum number of review points in the PR comment."
        type: number
        required: false
        default: 20
      llm_exclude_paths:
        description: "Comma or newline separated globs of files kept out of the diff sent to the model."
        type: string
        required: false
        default: 'package-lock.json,pnpm-lock.yaml,yarn.lock,poetry.lock,Pipfile.lock,*.min.js,*.map,dist/**,build/**,coverage/**'
    secrets:
      ai_token:
        description: "API key for the LLM provider, normally the repo's AI_TOKEN secret. Required only when enable_llm_review is true. Map your AI_TOKEN secret to ai_token in the calling job's secrets block, or use secrets: inherit."
        required: false

# Default to least privilege; individual jobs narrow further where they can
# and widen only where a specific step (e.g. SARIF upload) needs it.
permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Check language is supported
        shell: bash
        # Pass inputs via env rather than interpolating into the script body,
        # so a caller-supplied value can never be read as shell syntax.
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail

          # Single source of truth for supported languages — keep this list
          # in sync with README.md's supported-languages section.
          supported_languages="js ts python flutter unity"

          is_supported="false"
          for lang in $supported_languages; do
            if [ "${lang}" = "${LANGUAGE}" ]; then
              is_supported="true"
              break
            fi
          done

          if [ "${is_supported}" != "true" ]; then
            echo "::error::Unsupported language '${LANGUAGE}'. Supported values: ${supported_languages}"
            exit 1
          fi

          echo "Language '${LANGUAGE}' is supported."
      - name: Check flag combination is coherent
        shell: bash
        env:
          ENABLE_UNIT_TEST: ${{ inputs.enable_unit_test }}
          ENABLE_COVERAGE: ${{ inputs.enable_coverage }}
        run: |
          set -euo pipefail
          # coverage/action.yml only parses output the unit-test job
          # produces — it never runs tests itself. Catch the incoherent
          # combination here, fast and with a clear message, rather than
          # letting the coverage job fail later with a more oblique error.
          if [ "${ENABLE_COVERAGE}" = "true" ] && [ "${ENABLE_UNIT_TEST}" != "true" ]; then
            echo "::error::enable_coverage requires enable_unit_test to also be true — coverage is parsed from the unit-test run's output."
            exit 1
          fi

  lint:
    name: Lint
    if: inputs.enable_lint
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read # required by github/codeql-action/upload-sarif on private repos; see github/codeql-action#2117
      security-events: write # required by github/codeql-action/upload-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          python_version: ${{ inputs.python_version }}
      - name: Lint
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/lint@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}

  unit-test:
    name: Unit Test
    if: inputs.enable_unit_test
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          python_version: ${{ inputs.python_version }}
      - name: Unit test
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/unit-test@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}

  coverage:
    name: Coverage
    if: inputs.enable_coverage
    needs: [validate-inputs, unit-test]
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          python_version: ${{ inputs.python_version }}
      - name: Coverage
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/coverage@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          threshold: ${{ inputs.coverage_threshold }}

  dependency-scan:
    name: Dependency Scan
    if: inputs.enable_dependency_scan
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read # required by github/codeql-action/upload-sarif on private repos; see github/codeql-action#2117
      security-events: write # required by github/codeql-action/upload-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          python_version: ${{ inputs.python_version }}
      - name: Dependency scan
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/dependency-scan@v1.1.0-rc.4
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}

  secret-scan:
    name: Secret Scan
    if: inputs.enable_secret_scan
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read # required by github/codeql-action/upload-sarif on private repos; see github/codeql-action#2117
      security-events: write # required by github/codeql-action/upload-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for the push (full-history) scan mode,
          # and for the pull_request mode to be able to diff base..head.
          fetch-depth: 0
      - name: Secret scan
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/secret-scan@v1.1.0-rc.4
        with:
          working_dir: ${{ inputs.working_dir }}

  # --- Advisory AI review (two jobs) -------------------------------------
  # Both jobs are continue-on-error: a missing token, a rejected token or a
  # provider outage turns the LLM job red but never fails the run or blocks
  # any other check (docs/CHECK-POLICY.md: LLM review is advisory). The
  # review job's `if` keys off the preflight job's `ready` OUTPUT rather than
  # its result, so it runs only when preflight actually passed.
  llm-preflight:
    name: AI Review (token check)
    if: inputs.enable_llm_review
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
    steps:
      - name: Preflight
        id: preflight
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/llm-review@v1.1.0-rc.4
        with:
          mode: preflight
          language: ${{ inputs.language }}
          ai_token: ${{ secrets.ai_token }}
          llm_provider: ${{ inputs.llm_provider }}
          llm_base_url: ${{ inputs.llm_base_url }}
          llm_model: ${{ inputs.llm_model }}

  llm-review:
    name: AI Review
    # !cancelled() instead of the implicit success(): the review must run when
    # the other checks FAILED, since explaining those failures is the point.
    if: ${{ !cancelled() && inputs.enable_llm_review && needs.llm-preflight.outputs.ready == 'true' }}
    needs: [llm-preflight, lint, unit-test, coverage, dependency-scan, secret-scan]
    runs-on: ${{ inputs.runner_label }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # to post/update the review comment; never contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR diff (base...head) can be computed.
          fetch-depth: 0
      - name: Review
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/llm-review@v1.1.0-rc.4
        with:
          mode: review
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          ai_token: ${{ secrets.ai_token }}
          llm_provider: ${{ inputs.llm_provider }}
          llm_base_url: ${{ inputs.llm_base_url }}
          llm_model: ${{ inputs.llm_model }}
          llm_max_output_tokens: ${{ inputs.llm_max_output_tokens }}
          llm_timeout_seconds: ${{ inputs.llm_timeout_seconds }}
          llm_max_diff_kb: ${{ inputs.llm_max_diff_kb }}
          llm_max_findings: ${{ inputs.llm_max_findings }}
          llm_exclude_paths: ${{ inputs.llm_exclude_paths }}
          lint_result: ${{ needs.lint.result }}
          unit_test_result: ${{ needs.unit-test.result }}
          coverage_result: ${{ needs.coverage.result }}
          dependency_scan_result: ${{ needs.dependency-scan.result }}
          secret_scan_result: ${{ needs.secret-scan.result }}
          coverage_threshold: ${{ inputs.coverage_threshold }}
