# .github/workflows/central-ci.yml
#
# Reusable workflow: the single entry point consumer repos call into.
# Wires the composite actions under .github/actions/ into jobs, each gated
# behind its own boolean flag per CLAUDE.md's architecture rules. Trigger
# and branch policy stay entirely in the consumer's own ci.yml — this
# workflow only knows about `language` and the enable_* flags.
#
# Phase 1 implements checks for js/ts only (lint, unit-test, coverage,
# dependency-scan, secret-scan). python/flutter/unity are accepted by
# validate-inputs (they're on the project's eventual roadmap) but every
# check's own composite action hard-fails them with "not yet implemented
# in this version" rather than silently skipping or passing.
#
# Composite action references below use the full
# DevAnsh-Digital-Solutions/github-action-runner/... form pinned to @main,
# NOT a local `./` path. `uses: ./path` always resolves against whatever is
# currently checked out in the job's GITHUB_WORKSPACE — since every job
# here checks out the CALLING (consumer) repo first, a local path would
# resolve inside the consumer's tree instead of this repo's, and fail to
# find the action at all. This also means these internal references are
# currently pinned to @main regardless of what ref a consumer calls this
# workflow at, which deviates from README.md's stated versioning policy
# ("internal uses: references use the same ref the consumer called") —
# threading the actual caller-supplied ref through to these lines needs
# follow-up work; @main is the pragmatic fix for now.
name: Central CI

on:
  workflow_call:
    inputs:
      language:
        description: "Language to run checks for. One of: js, ts, python, flutter, unity."
        type: string
        required: true
      working_dir:
        description: "Directory containing the project to check, relative to the consumer repo root."
        type: string
        required: false
        default: '.'
      runner_label:
        description: "Runner label the jobs execute on."
        type: string
        required: false
        default: 'ubuntu-latest'
      enable_lint:
        description: "Run the lint check."
        type: boolean
        required: false
        default: true
      enable_unit_test:
        description: "Run the unit-test check. Must be true if enable_coverage is true."
        type: boolean
        required: false
        default: true
      enable_coverage:
        description: "Run the coverage check. Requires enable_unit_test: true, since coverage is parsed from the unit-test run's output."
        type: boolean
        required: false
        default: true
      enable_dependency_scan:
        description: "Run the dependency-scan (SCA) check."
        type: boolean
        required: false
        default: true
      enable_secret_scan:
        description: "Run the secret-scan check."
        type: boolean
        required: false
        default: true
      coverage_threshold:
        description: "Minimum required 'lines' coverage percentage, when enable_coverage is true."
        type: number
        required: false
        default: 80

# Default to least privilege; individual jobs narrow further where they can
# and widen only where a specific step (e.g. SARIF upload) needs it.
permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Check language is supported
        shell: bash
        # Pass inputs via env rather than interpolating into the script body,
        # so a caller-supplied value can never be read as shell syntax.
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail

          # Single source of truth for supported languages — keep this list
          # in sync with README.md's supported-languages section.
          supported_languages="js ts python flutter unity"

          is_supported="false"
          for lang in $supported_languages; do
            if [ "${lang}" = "${LANGUAGE}" ]; then
              is_supported="true"
              break
            fi
          done

          if [ "${is_supported}" != "true" ]; then
            echo "::error::Unsupported language '${LANGUAGE}'. Supported values: ${supported_languages}"
            exit 1
          fi

          echo "Language '${LANGUAGE}' is supported."
      - name: Check flag combination is coherent
        shell: bash
        env:
          ENABLE_UNIT_TEST: ${{ inputs.enable_unit_test }}
          ENABLE_COVERAGE: ${{ inputs.enable_coverage }}
        run: |
          set -euo pipefail
          # coverage/action.yml only parses output the unit-test job
          # produces — it never runs tests itself. Catch the incoherent
          # combination here, fast and with a clear message, rather than
          # letting the coverage job fail later with a more oblique error.
          if [ "${ENABLE_COVERAGE}" = "true" ] && [ "${ENABLE_UNIT_TEST}" != "true" ]; then
            echo "::error::enable_coverage requires enable_unit_test to also be true — coverage is parsed from the unit-test run's output."
            exit 1
          fi

  lint:
    name: Lint
    if: inputs.enable_lint
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read # required by github/codeql-action/upload-sarif on private repos; see github/codeql-action#2117
      security-events: write # required by github/codeql-action/upload-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
      - name: Lint
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/lint@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}

  unit-test:
    name: Unit Test
    if: inputs.enable_unit_test
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
      - name: Unit test
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/unit-test@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}

  coverage:
    name: Coverage
    if: inputs.enable_coverage
    needs: [validate-inputs, unit-test]
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
      - name: Coverage
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/coverage@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
          threshold: ${{ inputs.coverage_threshold }}

  dependency-scan:
    name: Dependency Scan
    if: inputs.enable_dependency_scan
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read # required by github/codeql-action/upload-sarif on private repos; see github/codeql-action#2117
      security-events: write # required by github/codeql-action/upload-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/setup@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}
      - name: Dependency scan
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/dependency-scan@main
        with:
          language: ${{ inputs.language }}
          working_dir: ${{ inputs.working_dir }}

  secret-scan:
    name: Secret Scan
    if: inputs.enable_secret_scan
    needs: validate-inputs
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read # required by github/codeql-action/upload-sarif on private repos; see github/codeql-action#2117
      security-events: write # required by github/codeql-action/upload-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for the push (full-history) scan mode,
          # and for the pull_request mode to be able to diff base..head.
          fetch-depth: 0
      - name: Secret scan
        uses: DevAnsh-Digital-Solutions/github-action-runner/.github/actions/secret-scan@main
        with:
          working_dir: ${{ inputs.working_dir }}
